name: scrape-ov-fiets

on:
  # Geen GitHub-schedule: die sloeg runs bij drukte over (gaten van uren).
  # De 5-minutentrigger is cron-job.org, dat elke 5 min een POST doet naar
  # https://api.github.com/repos/api28092026-cmyk/realtime-verzamelaar/actions/workflows/openov.yml/dispatches
  # met body {"ref":"main"} en een fine-grained token (alleen deze repo, Actions: read and write).
  # Zie CRON.md. Ook handmatig te starten via de Actions-tab.
  workflow_dispatch: {}

permissions:
  contents: write              # nodig om data terug te committen en releases te maken

concurrency:
  group: scrape
  cancel-in-progress: false

defaults:
  run:
    working-directory: openov

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      # De data van deze scraper staat op een eigen branch, zodat main schoon blijft
      - uses: actions/checkout@v5
        with:
          ref: data
          path: openov/data

      - name: Scrape
        run: python3 scrape.py

      # Afgesloten maanden: zip -> release (+ mail) -> uit de data-branch halen
      - name: Pak afgesloten maanden in
        id: pack
        run: echo "months=$(python3 archive.py pack)" >> "$GITHUB_OUTPUT"

      - name: Zet archief in release
        if: steps.pack.outputs.months != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MONTHS: ${{ steps.pack.outputs.months }}
        run: |
          for m in $MONTHS; do
            gh release create "data-$m" "archive/ovfiets_$m.zip" --target main \
              --title "OV-fiets data $m" --notes "Change log, scrape log en locatiekenmerken van $m." \
            || gh release upload "data-$m" "archive/ovfiets_$m.zip" --clobber
          done

      - name: Mail archief
        if: steps.pack.outputs.months != ''
        continue-on-error: true    # de release bestaat al; een mislukte mail mag het opruimen niet tegenhouden
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python3 archive.py mail ${{ steps.pack.outputs.months }}

      - name: Commit & push
        env:
          ARCHIVED: ${{ steps.pack.outputs.months }}
        run: |
          if [ -n "$ARCHIVED" ]; then python3 archive.py prune $ARCHIVED; fi
          cd data
          git config user.name  "ovfiets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub geeft soms kortstondig "Internal Server Error" op een push: tot 5x opnieuw proberen
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "poging $i mislukt, opnieuw"; sleep $((i * 5)); done; return 1; }
          if [ -n "$ARCHIVED" ]; then
            # Nieuwe branch-geschiedenis beginnen, zodat oude maanden ook uit de git-historie verdwijnen
            git checkout --orphan fresh
            git add -A
            git commit -m "reset na archivering $ARCHIVED ($(date -u +%Y-%m-%dT%H:%MZ))"
            retry git push --force origin fresh:data
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          retry sh -c 'git pull --rebase --quiet && git push'
