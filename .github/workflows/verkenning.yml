# Tijdelijk: verkent welke NS- en TenneT-endpoints werken en hoe de antwoorden eruitzien (alleen structuur).
name: Verkenning API's

on:
  workflow_dispatch: {}

jobs:
  verken:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Endpoints proberen
        shell: pwsh
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          TENNET_API_KEY: ${{ secrets.TENNET_API_KEY }}
        run: |
          function Structuur($o, $diepte = 0) {
            if ($null -eq $o) { return 'null' }
            if ($o -is [array]) { $n = $o.Count; if ($n -eq 0) { return '[]' }; return "[$n x " + (Structuur $o[0] ($diepte + 1)) + ']' }
            if ($o -is [pscustomobject]) {
              if ($diepte -ge 4) { return '{...}' }
              return '{' + (($o.PSObject.Properties | ForEach-Object { $_.Name + ':' + (Structuur $_.Value ($diepte + 1)) }) -join ', ') + '}'
            }
            $s = [string]$o; if ($s.Length -gt 40) { $s = $s.Substring(0, 40) + '...' }; return '"' + $s + '"'
          }
          function Probeer($naam, $url, $headers) {
            try {
              $r = Invoke-WebRequest -Uri $url -Headers $headers -TimeoutSec 60
              $txt = [Text.Encoding]::UTF8.GetString($r.RawContentStream.ToArray())
              Write-Host "=== $naam -> $($r.StatusCode), $($txt.Length) tekens, $($r.Headers['Content-Type'])"
              if ($txt.TrimStart().StartsWith('{') -or $txt.TrimStart().StartsWith('[')) { $s = Structuur ($txt | ConvertFrom-Json -Depth 50); Write-Host ($s.Substring(0, [Math]::Min(2500, $s.Length))) }
              else { Write-Host ($txt.Substring(0, [Math]::Min(700, $txt.Length))) }
            } catch { Write-Host "=== $naam -> FOUT: $($_.Exception.Message)" }
            Start-Sleep -Seconds 2
          }
          $ns = @{ 'Ocp-Apim-Subscription-Key' = $env:NS_API_KEY; 'Accept' = 'application/json' }
          $g = 'https://gateway.apiportal.ns.nl'
          $dep = (Invoke-RestMethod -Uri "$g/reisinformatie-api/api/v2/departures?station=UT&maxJourneys=5" -Headers $ns).payload.departures | Where-Object { $_.departureStatus -ne 'DEPARTED' } | Select-Object -First 1
          $nr = ($dep.name -replace '\D', '').TrimStart('0'); if (-not $nr) { $nr = $dep.product.number }
          Write-Host "trein voor proef: $nr ($($dep.trainCategory) richting $($dep.direction), vertrek $($dep.plannedDateTime))"
          Probeer "NS prognose $nr" "$g/virtual-train-api/api/v1/prognose/$nr" $ns
          Probeer "NS prognose $nr station UT" "$g/virtual-train-api/api/v1/prognose/$($nr)?station=UT" $ns
          Probeer "NS trein $nr (zonder v1)" "$g/virtual-train-api/api/trein/$nr" $ns
          Probeer "NS trein $nr station UT" "$g/virtual-train-api/api/trein/$nr/UT" $ns
          Probeer "NS v1 trein $nr station UT" "$g/virtual-train-api/api/v1/trein/$nr/UT" $ns
          Probeer "NS trip UT-ASD (crowdForecast?)" "$g/reisinformatie-api/api/v3/trips?fromStation=UT&toStation=ASD" $ns
          Probeer 'NS disruptions type MAINTENANCE' "$g/disruptions/v3?isActive=true&type=MAINTENANCE" $ns
          Probeer 'NS disruptions type CALAMITY' "$g/disruptions/v3?isActive=true&type=CALAMITY" $ns
          $tn = @{ 'apikey' = $env:TENNET_API_KEY; 'Accept' = 'text/csv' }
          $fmt = 'dd-MM-yyyy HH:mm:ss'; $gisteren = (Get-Date).Date.AddDays(-1)
          Probeer 'TenneT settlement prices gisteren 00-01u' ("https://api.tennet.eu/publications/v1/settlement-prices?date_from=" + [Uri]::EscapeDataString($gisteren.ToString($fmt)) + "&date_to=" + [Uri]::EscapeDataString($gisteren.AddHours(1).ToString($fmt))) $tn
          Probeer 'TenneT settlement prices vandaag tot nu' ("https://api.tennet.eu/publications/v1/settlement-prices?date_from=" + [Uri]::EscapeDataString((Get-Date).Date.ToString($fmt)) + "&date_to=" + [Uri]::EscapeDataString((Get-Date).ToString($fmt))) $tn