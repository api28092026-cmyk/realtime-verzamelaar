# OV-fiets beschikbaarheid (ovfietsbeschikbaar.nl): twee keer per week de ~4 weken historie van
# alle ~285 locaties ophalen en samenvoegen tot doorlopende reeksen per locatie per maand.
# De site rekent elke historiepagina op de server uit (~10-25 s per locatie), dus een run duurt
# 1,5 tot 2 uur. Gestart door cron-job.org op maandag en donderdag 04:20; zie CRON.md.
name: OV-fiets

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Eigen wachtrij: deze lange run mag de laadpunten- en dagelijkse runs niet ophouden. Ze schrijven naar
# andere bestanden (alleen data/ovfiets), dus 'git pull --rebase' voor het pushen botst nooit.
concurrency:
  group: ovfiets
  cancel-in-progress: false

jobs:
  ovfiets:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Historie en live-stand ophalen
        continue-on-error: true   # exitcode 1 = enkele locaties niet in orde; de rest wordt wel bewaard
        timeout-minutes: 270      # ruim binnen de joblimiet, zodat samenvoegen en vastleggen altijd nog lukken
        run: |
          # Exitcode 1 = een paar locaties niet in orde; dan moet de live-stand hierna toch nog worden opgehaald.
          python -u ovfiets/scrape_ovfiets.py --all --no-raw --out /tmp/ovfiets || echo "::warning::Niet alle locaties in orde (zie log)"
          python -u ovfiets/scrape_ovfiets.py --index --out /tmp/ovfiets

      - name: Samenvoegen
        if: always()
        run: python ovfiets/samenvoegen.py /tmp/ovfiets data/ovfiets

      - name: Data vastleggen
        if: always()
        run: |
          git config user.name  "verzamelaar"
          git config user.email "verzamelaar@users.noreply.github.com"
          git add data/ovfiets
          git commit -m "OV-fiets $(date -u +%F)" || { echo "Geen wijzigingen"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; echo "poging $i mislukt, opnieuw"; sleep $((i * 5)); done
          exit 1
