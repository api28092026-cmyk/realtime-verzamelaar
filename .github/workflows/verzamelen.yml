# Draait de verzamelaar op een GitHub-server en legt de aggregaten vast in deze repository.
# Gestart door cron-job.org (dagelijks 06:30, optioneel laadpunten elk uur); zie CRON.md.
name: Verzamelen

on:
  workflow_dispatch:
    inputs:
      bron:
        description: 'Bronnen, komma-gescheiden (leeg = alle): EnergyZero, TenderNed, RDW, Laadpunten, Netcongestie, KvkOpenData, Parkeren, Deelmobiliteit, Verstoringen, OV, NS, Energie'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: data-commit          # gedeeld met ovfiets.yml, zodat twee runs niet tegelijk pushen
  cancel-in-progress: false

jobs:
  verzamel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bronnen ophalen
        shell: pwsh
        continue-on-error: true   # één falende bron mag de rest niet blokkeren
        env:
          BRON: ${{ github.event.inputs.bron }}
          NS_API_KEY: ${{ secrets.NS_API_KEY }}           # GitHub-geheimen; nooit in de code of de logs
          TENNET_API_KEY: ${{ secrets.TENNET_API_KEY }}
        run: |
          if ($env:BRON) { ./Verzamel.ps1 -Bron (($env:BRON -split ',') | ForEach-Object { $_.Trim() }) } else { ./Verzamel.ps1 }

      - name: Data vastleggen
        run: |
          git config user.name  "verzamelaar"
          git config user.email "verzamelaar@users.noreply.github.com"
          git add data
          git commit -m "Data $(date -u +%F)" || { echo "Geen wijzigingen"; exit 0; }
          git pull --rebase
          git push
